<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Superliga NFL</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#0b1536;--mut:#566086;--line:#cfd6e6;--navy:#12236b;--gold:#9a7210;--goldbg:#f4e6bd;--bad:#b3261e;--badbg:#fbe4e1;--hl:#e6ebfa;
--hd:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--bd:'Barlow','Segoe UI',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d24;--card:#0e1838;--ink:#eef0f6;--mut:#9aa5c4;--line:#24336b;--navy:#1d3496;--gold:#e0b64f;--goldbg:#2b2710;--bad:#ff8b80;--badbg:#3a1a1c;--hl:#14214f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d24;--card:#0e1838;--ink:#eef0f6;--mut:#9aa5c4;--line:#24336b;--navy:#1d3496;--gold:#e0b64f;--goldbg:#2b2710;--bad:#ff8b80;--badbg:#3a1a1c;--hl:#14214f;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--bd);min-height:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--gold)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:760px;margin:auto}
.bar img{width:46px;height:46px}
.bar h1{font:800 26px/1 var(--hd);margin:0;letter-spacing:.02em}
.bar p{margin:2px 0 0;font-size:13px;color:var(--mut)}
nav{display:flex;gap:4px;max-width:760px;margin:auto;padding:0 12px;overflow-x:auto}
nav button{flex:1;min-width:76px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:700 17px var(--hd);letter-spacing:.04em;padding:8px 6px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:760px;margin:auto;padding:16px}
section[hidden]{display:none}
h2{font:800 24px/1.1 var(--hd);margin:22px 0 10px;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.score{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:14px;padding:18px 14px;border:2px solid var(--gold)}
.score .wm{position:absolute;right:-30px;top:-20px;width:190px;opacity:.12}
.sb{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.sb b{display:block;font:800 52px/1 var(--hd)}
.sb small{display:block;font-size:13px;opacity:.85}
.sb .nm{font:700 18px/1.1 var(--hd);letter-spacing:.03em}
.vs{font:700 14px var(--hd);opacity:.7}
.win{position:relative;margin-top:14px}
.win div{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.win i{display:block;height:100%;background:#e0b64f}
.win span{display:block;margin-top:6px;font-size:13px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats .card{text-align:center;padding:10px 6px}
.stats b{display:block;font:800 26px/1.1 var(--hd)}
.stats small{color:var(--mut);font-size:13px}
.al{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.al li{padding:10px 12px;border-radius:8px;border-left:4px solid var(--gold);background:var(--goldbg);font-size:15px}
.al li.bad{border-color:var(--bad);background:var(--badbg)}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.row{display:grid;grid-template-columns:1fr 38px 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .p{min-width:0}.row .p b{display:block;font-weight:600;font-size:15px}
.row .p small{display:block;color:var(--mut);font-size:12px}
.row .r{text-align:right}
.row em{font-style:normal;font-weight:600;color:var(--gold)}
.slot{text-align:center;font:700 14px var(--hd);background:var(--navy);color:#fff;border-radius:5px;padding:3px 0}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:4px;background:var(--badbg);color:var(--bad)}
.tag.bye{background:var(--hl);color:var(--mut)}
.hd2{display:grid;grid-template-columns:1fr 1fr;font:700 17px var(--hd);padding-bottom:6px;border-bottom:2px solid var(--gold)}
.hd2 span:last-child{text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:700 15px var(--hd);text-align:left;color:var(--mut);padding:6px 4px;border-bottom:2px solid var(--gold)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
tr.me td{background:var(--hl);font-weight:600}
td.n{width:26px;color:var(--mut)}td.v{white-space:nowrap}
.pf{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pf i{display:block;height:6px;border-radius:3px;background:var(--gold)}
.tl{display:grid;gap:0}
.tl div{padding:8px 0 8px 18px;border-left:3px solid var(--line);position:relative}
.tl div::before{content:"";position:absolute;left:-8px;top:13px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.tl .now{border-color:var(--gold)}.tl .now::before{border-color:var(--gold);background:var(--gold)}
.tl b{font:700 18px var(--hd)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv b{font-weight:600}
.add{border:2px dashed var(--line);background:none;color:var(--mut)}
a{color:var(--gold)}
@media (max-width:420px){.sb b{font-size:42px}.grid2{grid-template-columns:1fr}}
select{width:100%;margin-bottom:12px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--bd)}
input,textarea,.btn{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--bd);width:100%}
.btn{width:auto;cursor:pointer;background:var(--navy);color:#fff;border:0;margin-top:8px}
.seg{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.seg .btn{margin:0;white-space:nowrap;background:var(--card);color:var(--mut);border:1px solid var(--line)}.seg .btn[aria-pressed=true]{background:var(--navy);color:#fff}
.chip{display:inline-block;margin:2px;padding:3px 8px;border-radius:12px;background:var(--hl);font-size:13px;cursor:pointer}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}.verdict{padding:12px;border-radius:8px;margin-top:10px;background:var(--hl)}.verdict.ok{background:var(--goldbg)}.verdict.bad{background:var(--badbg)}.verdict .big{font:800 24px var(--hd);display:block}
</style>
</head>
<body>
<header>
<div class="bar"><img src="assets/logo.png" alt="Escudo"><div><h1>Central Superliga NFL</h1><p id="upd">Painel dos meus times de fantasy</p></div></div>
<nav role="tablist" id="nav"></nav>
</header>
<main id="main"><p class="note">Carregando…</p></main>
<script>
var D,L=[],cur=0,tab='capa',main=document.getElementById('main'),nav=document.getElementById('nav');
var fm=function(x){return x==null?'—':Number(x).toFixed(2).replace('.',',')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return '&#'+c.charCodeAt(0)+';'})};
var BAD=['Out','IR','Sus','Doubtful','PUP','NA','COV'];
function tg(p){return p.inj?'<span class="tag'+(BAD.indexOf(p.inj)<0?' bye':'')+'">'+esc(p.inj)+'</span>':''}
function pl(p,r){return '<div class="p '+(r?'r':'')+'"><b>'+esc(p.n)+tg(p)+(p.bye?'<span class="tag bye">BYE</span>':'')+'</b><small>'+esc((p.tm||'')+' '+(p.pos||'')+(p.opp?' · '+p.opp:''))+' · <em>'+fm(p.pts)+'</em>'+(p.proj!=null?' · proj '+fm(p.proj):'')+'</small></div>'}
function rows(A,B,lab){return A.map(function(a,i){var b=B&&B[i];return '<div class="row">'+pl(a,0)+'<div class="slot">'+(lab?lab[i]:esc(a.slot))+'</div>'+(b?pl(b,1):'<div></div>')+'</div>'}).join('')}
var V={
capa:function(l){var m=l.me;if(!m)return '<p class="note">Seu time não foi encontrado nesta liga.</p>';var o=l.opp,s=l.standings.filter(function(x){return x.me})[0],rk=l.standings.indexOf(s)+1,g=(s.w+s.l+s.t)||1,rec=s.w+'-'+s.l+(s.t?'-'+s.t:'');
var al=[];m.starters.forEach(function(p){if(p.n=='(vazio)')al.push('<li class="bad">Vaga de '+esc(p.slot)+' está vazia.</li>');else if(p.inj)al.push('<li class="'+(BAD.indexOf(p.inj)<0?'':'bad')+'">'+esc(p.n)+' ('+esc(p.slot)+') está com status '+esc(p.inj)+' no Sleeper.</li>')});
if(!al.length)al.push('<li>Nenhum titular com status de lesão no Sleeper.</li>');
return '<div class="score"><img class="wm" src="assets/logo.png" alt=""><div class="sb"><div><span class="nm">'+esc(m.team)+'</span><b>'+fm(m.total)+'</b><small>'+rec+' · #'+rk+' na liga</small></div><div class="vs">Semana '+D.week+'</div><div>'+(o?'<span class="nm">'+esc(o.team)+'</span><b>'+fm(o.total)+'</b><small>adversário</small>':'<span class="nm">Sem adversário</span><b>—</b>')+'</div></div></div>'
+'<div class="stats"><div class="card"><b>'+fm(s.pf)+'</b><small>pontos feitos</small></div><div class="card"><b>'+fm(s.pa)+'</b><small>pontos sofridos</small></div><div class="card"><b>'+fm(s.pf/g)+'</b><small>média por semana</small></div></div>'
+'<h2>Alertas da rodada</h2><ul class="al">'+al.join('')+'</ul><p class="note">Pontos direto do Sleeper. Status de lesão dos jogadores é atualizado uma vez por dia. Projeção, chance de vitória e bye não existem na API.</p>'},
rod:function(l){var m=l.me,o=l.opp;if(!m)return '';return '<h2>Semana '+D.week+'</h2><div class="hd2"><span>'+esc(m.team)+'</span><span>'+(o?esc(o.team):'—')+'</span></div>'+rows(m.starters,o&&o.starters)+'<h2>Banco</h2>'+rows(m.bench,o&&o.bench,m.bench.map(function(){return 'BN'}))+(m.ir.length?'<h2>Reserva (IR)</h2>'+rows(m.ir,o&&o.ir,m.ir.map(function(){return 'IR'})):'')},
liga:function(l){var mx=Math.max.apply(null,l.standings.map(function(x){return x.pf}))||1;return '<h2>'+esc(l.name)+'</h2><div class="card"><table><tr><th></th><th>Time</th><th>V-D</th><th style="text-align:right">Pontos</th></tr>'+l.standings.map(function(x,i){return '<tr class="'+(x.me?'me':'')+'"><td class="n">'+(i+1)+'</td><td>'+esc(x.team)+'</td><td class="v">'+x.w+'-'+x.l+(x.t?'-'+x.t:'')+'</td><td><div class="pf"><i style="width:'+Math.round(x.pf/mx*60)+'px"></i>'+fm(x.pf)+'</div></td></tr>'}).join('')+'</table></div><p class="note">Ordem por vitórias e, no empate, por pontos feitos. O critério oficial da liga pode ser diferente.</p>'},
reg:function(l){var c=l.cfg,k=function(a,b){return b==null?'':'<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>'},N={rec:'Recepção',pass_yd:'Jarda de passe',pass_td:'TD de passe',pass_int:'Interceptação lançada',rush_yd:'Jarda corrida',rec_yd:'Jarda de recepção',rush_td:'TD de corrida',rec_td:'TD de recepção',fum_lost:'Fumble perdido',sack:'Sack (defesa)',int:'Interceptação (defesa)',tkl_loss:'Tackle for loss'};
var td=c.trade&&c.trade<D.week?'encerrado':'semana '+c.trade;
return '<h2>Calendário</h2><div class="tl"><div class="now"><b>Semana '+D.week+' · agora</b></div>'+(c.trade?'<div><b>Prazo de trocas</b><br><small>'+td+'</small></div>':'')+'<div><b>Playoffs</b><br><small>semana '+c.playoff+' · '+c.pteams+' times</small></div></div><h2>Liga</h2><div class="card">'+k('Times',c.teams)+k('Lineup',c.pos.filter(function(x){return x!='BN'}).join(', '))+k('Banco',c.pos.filter(function(x){return x=='BN'}).length)+k('Vagas de IR',c.res)+k('Orçamento de waiver',c.waiver)+'</div><h2>Pontuação</h2><div class="card">'+Object.keys(N).map(function(x){return k(N[x],c.score[x]==null?null:String(c.score[x]).replace('.',','))}).join('')+'</div>'}};
var LS={g:function(k,d){try{var v=localStorage.getItem('cs_'+k);return v?JSON.parse(v):d}catch(e){return d}},s:function(k,v){try{localStorage.setItem('cs_'+k,JSON.stringify(v))}catch(e){}}};
var $=function(i){return document.getElementById(i)};
function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x))}
function Phi(z){return 0.5*(1+erf(z/Math.SQRT2))}
var GONE=['Out','IR','Sus','NA','PUP','COV'];
function live(p){return !p.bye&&GONE.indexOf(p.inj)<0}
function rem(s){return s.starters.reduce(function(a,p){return a+(live(p)&&!p.pts&&p.proj?p.proj:0)},0)}
function ptot(s){return s.starters.reduce(function(a,p){return a+(live(p)&&p.proj?p.proj:0)},0)}
function winp(n1,r1,n2,r2){var d=n1+r1-n2-r2,a=28*Math.sqrt(Math.min(1,r1/115)),b=28*Math.sqrt(Math.min(1,r2/115)),sd=Math.sqrt(a*a+b*b);return sd<0.5?(d>0?1:d<0?0:0.5):Phi(d/sd)}
function mine(l){return l.me?l.me.starters.concat(l.me.bench,l.me.ir).filter(function(p){return p.n!='(vazio)'}):[]}
var capa0=V.capa,reg0=V.reg;
V.capa=function(l){var h=capa0(l),m=l.me,o=l.opp;if(!m||!o)return h;var a=ptot(m),b=ptot(o),p=winp(m.total||0,rem(m),o.total||0,rem(o)),by=m.starters.filter(function(x){return x.bye}).map(function(x){return '<li class="bad">'+esc(x.n)+' ('+esc(x.slot)+') está de bye nesta semana.</li>'}).join('');
var c='<div class="card" style="margin-top:12px"><b>Projeção dos titulares: '+fm(a)+' × '+fm(b)+'</b><br>Chance de vitória (modelo próprio): <b>'+Math.round(p*100)+'%</b><div style="height:8px;border-radius:4px;background:var(--line);margin-top:6px"><i style="display:block;height:100%;width:'+Math.round(p*100)+'%;background:var(--gold);border-radius:4px"></i></div><p class="note">Projeções do Sleeper recalculadas com a pontuação da liga e a curva da ferramenta Confronto. Não é o número do app.</p></div>';
return h.replace('<div class="stats">',c+'<div class="stats">').replace('<ul class="al">','<ul class="al">'+by)};
V.reg=function(l){var by={};mine(l).forEach(function(p){var w=D.byes&&p.tm&&D.byes[p.tm];if(w)(by[w]=by[w]||[]).push(p.n)});
var bh=Object.keys(by).sort(function(a,b){return a-b}).map(function(w){return '<div class="kv"><span>Semana '+w+'</span><b>'+by[w].map(esc).join(', ')+'</b></div>'}).join('');
return reg0(l)+(bh?'<h2>Byes do meu elenco</h2><div class="card">'+bh+'</div>':'')+'<h2>Trocas</h2><div class="card"><p class="note" style="margin:0">Regra citada no Diário original da Superliga: trocas 2 por 1, validadas na calculadora da Superliga com diferença de até 10%; o comissário aprova às terças. Confirme no regulamento oficial.</p></div>'};
V.news=function(){var n=D.news||[];return '<h2>Plantão</h2>'+(n.length?n.map(function(x){return '<div class="card" style="margin-bottom:8px"><a href="'+esc(x.u)+'" target="_blank" rel="noopener"><b>'+esc(x.t)+'</b></a><br><small class="note">'+esc(x.s)+' · '+(isNaN(Date.parse(x.d))?'':new Date(x.d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))+' · '+x.p.map(esc).join(', ')+'</small></div>'}).join(''):'<p class="note">Nenhuma manchete recente citando seus jogadores.</p>')+'<p class="note">Manchetes e links de ESPN e CBS Sports (feeds RSS públicos). Só aparecem matérias que citam jogadores do seu elenco ou do adversário; a leitura completa é no site de origem.</p>'};
var FT='troca',FTS=[['troca','Troca'],['conf','Confronto'],['pts','Pontos'],['ss','Titular ou banco'],['chk','Checklist']],PM='off';
V.fer=function(l){return '<h2>Ferramentas</h2>'+(l.me?'<div class="seg">'+FTS.map(function(t){return '<button class="btn" data-ft="'+t[0]+'" aria-pressed="'+(t[0]==FT)+'">'+t[1]+'</button>'}).join('')+'</div><div id="fp"></div>':'<p class="note">Seu time não foi encontrado nesta liga.</p>')};
V.post=function(l){if(tab!='fer'||!l.me)return;var bs=main.querySelectorAll('[data-ft]');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){FT=this.getAttribute('data-ft');draw()};({troca:bTroca,conf:bConf,pts:bPts,ss:bSS,chk:bChk})[FT](l)};
function opt(a){return a.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')}
function fld(t,id,v,x){return '<label>'+t+'</label><input type="number" step="0.01" id="'+id+'" value="'+(v==null?'':v)+'" '+(x||'')+'>'}
var HDR=/^(jogador|pos\.?|time|valor|total|desafiante|lista completa|fechar)/i;
function parseVals(s){var out=[],cur=null;s.split(/\t|\r?\n|\s{2,}/).forEach(function(x){x=x.trim();if(!x)return;if(/^-?\d+([.,]\d+)?$/.test(x)){if(cur){out.push([cur,parseFloat(x.replace(',','.'))]);cur=null}}else if(!cur&&/[a-z]/.test(x)&&!HDR.test(x))cur=x});return out}
function bTroca(l){var v=LS.g('vals',[]),g=LS.g('give',[]),r=LS.g('get',[]),fp=$('fp');function val(n){for(var i=0;i<v.length;i++)if(v[i][0]==n)return +v[i][1]||0;return 0}
function chips(a,k){return a.map(function(n,i){return '<span class="chip" data-'+k+'="'+i+'">'+esc(n)+' ('+val(n)+') ✕</span>'}).join('')}
function paint(){LS.s('give',g);LS.s('get',r);var N=v.map(function(x){return x[0]}),A=g.reduce(function(s,n){return s+val(n)},0),B=r.reduce(function(s,n){return s+val(n)},0),T=A+B,lim=T*0.1,d=A-B,out;
if(!g.length||!r.length)out='<div class="verdict">Escolha quem você manda e quem você recebe.</div>';else{var ok=Math.abs(d)<=lim;out='<div class="verdict '+(ok?'ok':'bad')+'"><span class="big">'+(ok?'Válida':'Inválida')+' · '+A+' × '+B+'</span>Diferença de '+Math.abs(d)+' (limite '+lim.toFixed(1).replace('.',',')+', 10% de '+T+').</div>'}
fp.innerHTML='<p class="note">Regra do Diário original: a diferença entre os lados deve ficar em até 10% da soma. Os valores vêm da calculadora da Superliga; digite-os na tabela abaixo.</p><div class="grid2"><div><b>Você manda</b><div>'+chips(g,'g')+'</div><select id="gs"><option value="">Adicionar…</option>'+opt(N)+'</select></div><div><b>Você recebe</b><div>'+chips(r,'r')+'</div><select id="rs"><option value="">Adicionar…</option>'+opt(N)+'</select></div></div>'+out+'<h2>Tabela de valores</h2>'+(v.map(function(x,i){return '<div class="kv"><span>'+esc(x[0])+'</span><b>'+x[1]+' <a href="#" data-d="'+i+'">remover</a></b></div>'}).join('')||'<p class="note">Tabela vazia.</p>')+'<div class="grid2"><input id="vn" placeholder="Jogador"><input id="vv" type="number" placeholder="Valor"></div><button class="btn" id="va">Adicionar</button><h2>Importar lista</h2><p class="note">Na calculadora da Superliga, abra "Lista Completa", selecione a tabela, copie e cole aqui. Confira o resultado na tabela acima.</p><textarea id="vp" rows="4" placeholder="Jogador, posição, time, valor"></textarea><button class="btn" id="vi">Importar</button>'}

fp.innerHTML='<div class="grid2">'+box('a')+box('b')+'</div><div class="verdict" id="sout"></div><p class="note">Fórmula do Diário original: projeção × (1 + ((ranking − 16,5) / 15,5) × 0,12) × fator do status. Projeção e status vêm dos dados e podem ser editados.</p>';
