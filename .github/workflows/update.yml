name: Atualizar dados
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Atualiza dados" && git push)
